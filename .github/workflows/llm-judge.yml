name: CI & LLM Code Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Descargar dependencias
        run: go mod download

      - name: Verificar compilación
        run: go build -v ./...

      - name: Ejecutar Tests Unitarios
        run: go test -v -race -coverprofile=coverage.out ./...

  review:
    name: LLM-as-a-Judge Code Review
    needs: test # Obligatorio: Solo se ejecuta si el job de tests pasa exitosamente
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias RAG
        run: |
          pip install google-genai PyGithub chromadb langchain-chroma langchain-community langchain-text-splitters langchain-google-genai

      - name: Indexar Documentación RAG
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/index_docs.py

      - name: Ejecutar RAG LLM Judge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python .github/scripts/llm_judge.py
